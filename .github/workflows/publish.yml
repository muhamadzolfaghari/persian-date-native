name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Ensure CI runtime tools exist
        run: npm install --no-save ts-node

      - name: Run unit and E2E tests
        run: |
          npm test -- --runInBand
          npm run test:e2e
          npm run check:examples

      - name: Build package
        run: npm run build

      - name: Verify build & bundle budgets
        run: npm run verify:build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Ensure version is not already published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::${NAME}@${VERSION} already exists on npm"
            exit 1
          fi
          echo "Publishing ${NAME}@${VERSION}"

      - name: Publish to npm with OIDC trusted publishing
        run: npm publish --provenance --access public

      - name: Post-Publish Registry & CDN Validation Smoke Test
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Verifying $NAME@$VERSION on npm registry..."
          npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org
          
          echo "Waiting 15s for CDN edge synchronization..."
          sleep 15
          
          echo "Verifying unpkg distribution..."
          curl -sSfL "https://unpkg.com/${NAME}@${VERSION}/dist/index.global.min.js" > unpkg_test.js
          node -e "require('./unpkg_test.js'); if (!global.PersianDateNative) throw new Error('unpkg bundle missing global'); console.log('✅ unpkg verified');"
          
          echo "Verifying jsDelivr distribution..."
          curl -sSfL "https://cdn.jsdelivr.net/npm/${NAME}@${VERSION}/dist/index.global.min.js" > jsdelivr_test.js
          node -e "require('./jsdelivr_test.js'); if (!global.PersianDateNative) throw new Error('jsdelivr bundle missing global'); console.log('✅ jsdelivr verified');"
          
          echo "🎉 Post-publish registry & CDN validation passed 100%!"
