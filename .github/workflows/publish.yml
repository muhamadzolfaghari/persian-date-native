name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Ensure CI runtime tools exist
        run: npm install --no-save ts-node

      - name: Run unit and documentation E2E tests
        run: |
          npm test -- --runInBand
          npm run test:e2e

      - name: Build package
        run: npm run build

      - name: Validate framework examples
        run: npm run check:examples

      - name: Verify build & bundle budgets
        run: npm run verify:build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Ensure version is not already published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::${NAME}@${VERSION} already exists on npm"
            exit 1
          fi
          echo "Publishing ${NAME}@${VERSION}"

      - name: Publish to npm with OIDC trusted publishing
        run: npm publish --provenance --access public

      - name: Post-Publish Registry & CDN Validation Smoke Test
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          echo "Waiting for $NAME@$VERSION to become visible on npm..."
          registry_ready=false
          for attempt in {1..12}; do
            if npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              registry_ready=true
              echo "✅ npm registry verified"
              break
            fi
            echo "Registry not ready yet (attempt ${attempt}/12)"
            sleep 5
          done
          if [ "${registry_ready}" != "true" ]; then
            echo "::error::${NAME}@${VERSION} did not become visible on npm within the validation window"
            exit 1
          fi

          verify_cdn() {
            local label="$1"
            local url="$2"
            local output="$3"
            local ready=false

            for attempt in {1..12}; do
              if curl -sSfL "${url}" > "${output}"; then
                ready=true
                break
              fi
              echo "${label} not ready yet (attempt ${attempt}/12)"
              sleep 5
            done

            if [ "${ready}" != "true" ]; then
              echo "::error::${label} did not become available within the validation window"
              exit 1
            fi

            node -e "require('./${output}'); if (!global.PersianDateNative) throw new Error('${label} bundle missing global');"
            echo "✅ ${label} verified"
          }

          verify_cdn "unpkg" "https://unpkg.com/${NAME}@${VERSION}/dist/index.global.min.js" "unpkg_test.js"
          verify_cdn "jsDelivr" "https://cdn.jsdelivr.net/npm/${NAME}@${VERSION}/dist/index.global.min.js" "jsdelivr_test.js"

          echo "🎉 Post-publish registry & CDN validation passed"
