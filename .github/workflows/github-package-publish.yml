name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm ci

      - name: Ensure CI runtime tools exist
        run: npm install --no-save ts-node

      - name: Run tests
        run: |
          npm test -- --runInBand
          npm run test:e2e
          npm run check:examples

      - name: Build package
        run: npm run build

      - name: Prepare GitHub Packages artifact
        run: |
          mkdir -p github-package
          cp package.json README.md LICENSE* github-package/ 2>/dev/null || true
          cp -r dist github-package/
          cd github-package
          node -e "const fs=require('fs');const p=require('./package.json');p.name='@muhamadzolfaghari/persian-date-native';delete p.publishConfig;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Publish GitHub Package
        working-directory: github-package
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
